<!-- AI voice guide. Nothing is spoken until the visitor presses a button. -->
<div class="ai-dock" id="ai-dock">
  <section class="ai-panel" id="ai-panel" aria-label="AI voice guide" hidden>
    <header class="ai-head">
      <span class="ai-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div class="ai-head-text">
        <strong>AI voice guide</strong>
        <span id="ai-status" class="ai-status">Ready</span>
      </div>
      <button type="button" class="ai-icon-btn" id="ai-close" aria-label="Minimise the AI guide"><i class="fa-solid fa-chevron-down"></i></button>
    </header>

    <div class="ai-caption" id="ai-caption" aria-live="off">Choose a topic below and press play. Your browser reads the page aloud, so nothing is sent anywhere.</div>
    <div class="ai-progress" id="ai-progress" aria-hidden="true"><span></span></div>

    <div class="ai-chips" role="group" aria-label="Topics">
      <button type="button" class="ai-chip" data-ai-topic="intro">Intro</button>
      <button type="button" class="ai-chip" data-ai-topic="about">About</button>
      <button type="button" class="ai-chip" data-ai-topic="skills">Skills</button>
      <button type="button" class="ai-chip" data-ai-topic="projects">Projects</button>
      <button type="button" class="ai-chip" data-ai-topic="journey">Journey</button>
      <button type="button" class="ai-chip" data-ai-topic="contact">Contact</button>
      <button type="button" class="ai-chip ai-chip-tour" data-ai-topic="tour"><i class="fa-solid fa-route"></i> Full tour</button>
    </div>

    <div class="ai-controls">
      <button type="button" class="ai-icon-btn" id="ai-prev" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button>
      <button type="button" class="ai-icon-btn ai-play" id="ai-play" aria-label="Play"><i class="fa-solid fa-play"></i></button>
      <button type="button" class="ai-icon-btn" id="ai-stop" aria-label="Stop"><i class="fa-solid fa-stop"></i></button>
      <button type="button" class="ai-icon-btn" id="ai-next" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button>
      <label class="ai-select"><span class="visually-hidden">Speed</span>
        <select id="ai-rate">
          <option value="0.85">0.85x</option>
          <option value="1" selected>1x</option>
          <option value="1.15">1.15x</option>
          <option value="1.3">1.3x</option>
        </select>
      </label>
      <label class="ai-select ai-voice"><span class="visually-hidden">Voice</span>
        <select id="ai-voice"><option value="">Default voice</option></select>
      </label>
    </div>
    <p class="ai-note" id="ai-unsupported" hidden>This browser cannot read text aloud. Try Chrome, Edge or Safari.</p>
  </section>

  <button type="button" class="ai-fab" id="ai-fab" aria-expanded="false" aria-controls="ai-panel">
    <span class="ai-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="ai-fab-label">Listen</span>
  </button>
</div>
